name: vms-recorder
display_name: VMS Recorder
version: 0.1.0
category: recording
description: Continuous RTSP recording to segmented MP4 (stream copy, no transcoding) with retention.
image: ellalon/vms-recorder:0.1.0
autostart: true
http_port: 8000
env:
  SEGMENT_SECONDS: "300"
  RETENTION_DAYS: "30"
  MIN_FREE_GB: "20"
volumes:
  - host: recordings
    container: /recordings
health:
  type: heartbeat
capabilities: [recording, playback, export]
