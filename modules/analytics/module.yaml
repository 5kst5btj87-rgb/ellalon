name: analytics
display_name: Video Analytics
version: 0.2.0
category: analytics
description: Per-camera video analytics - people/vehicle detection (YOLOX), intrusion zones, line crossing, loitering, motion areas. Configure per camera in the Cameras tab.
image: ellalon/analytics:0.2.0
autostart: false
http_port: 8000
gpu: false          # set true + build a GPU image for deep-learning detectors
shm_size: 512m
env:
  ANALYTICS_FPS: "3"           # analysed frames per second per camera
  ANALYTICS_SNAPSHOT_DAYS: "14" # keep event snapshots this long
capabilities: [motion, objects, intrusion, line-crossing, loitering]
volumes:
  - host: data
    container: /data
