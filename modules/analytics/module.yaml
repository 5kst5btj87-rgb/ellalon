name: analytics
display_name: Video Analytics
version: 0.1.0
category: analytics
description: Per-camera analytics pipeline. Ships with motion detection; add detectors (YOLO, LPR, ...) as plugins.
image: ellalon/analytics:0.1.0
autostart: false
http_port: 8000
gpu: false          # set true + build a GPU image for deep-learning detectors
shm_size: 512m
env:
  ANALYTICS_FPS: "5"
  MOTION_MIN_AREA: "0.01"      # fraction of frame
  MOTION_COOLDOWN: "10"        # seconds between events per camera
capabilities: [motion, detector-plugins]
