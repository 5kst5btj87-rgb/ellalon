name: videowall
display_name: Video Wall
version: 0.1.0
category: display
description: Wall/monitor layouts and live-tile control. Syncs cameras into the streaming gateway.
image: ellalon/videowall:0.1.0
autostart: true
http_port: 8000
depends_on: [streaming]
env:
  GO2RTC_URL: http://ellalon-streaming:1984
volumes:
  - host: data
    container: /data
capabilities: [layouts, walls, push-to-wall]
